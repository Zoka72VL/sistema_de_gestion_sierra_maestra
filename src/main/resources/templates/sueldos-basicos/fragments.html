<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <div th:fragment="lista">
    <div th:if="${#lists.isEmpty(items)}">No hay sueldos básicos.</div>
    <div th:each="s : ${items}" class="card mb-2 p-2">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <strong th:text="${s.id}">ID</strong>
          <div class="muted" th:text="${s.monto}">Monto</div>
        </div>
      </div>
    </div>
  </div>

  <div th:fragment="form">
    <form th:action="@{/sueldos-basicos/save}" th:object="${sueldo}" hx-post="/sueldos-basicos/save" hx-target="#sueldos-basicos-list" hx-swap="innerHTML">
      <input type="hidden" th:field="*{id}" />
      <div class="mb-2">
        <label>Monto</label>
        <input class="form-control" th:field="*{monto}" />
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-primary" type="submit">Guardar</button>
        <button type="button" class="btn btn-secondary" onclick="htmx.ajax('GET','/sueldos-basicos/list','#sueldos-basicos-list')">Cancelar</button>
      </div>
    </form>
  </div>
</html>
