<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(~{::content})">
  <section th:fragment="content">
    <div class="card p-3 mb-3">
      <div class="d-flex justify-content-between align-items-center">
        <h2 class="m-0">Sueldos Básicos</h2>
        <div>
          <button class="btn btn-outline-primary me-2" hx-get="/sueldos-basicos/list" hx-target="#sueldos-basicos-list" hx-swap="innerHTML">Cargar</button>
          <button class="btn btn-success" hx-get="/sueldos-basicos/form" hx-target="#sueldos-basicos-form" hx-swap="innerHTML">Nuevo</button>
        </div>
      </div>
    </div>

  <div id="sueldos-basicos-list"></div>
  <div id="sueldos-basicos-form" class="mt-3"></div>
  <script>document.addEventListener('DOMContentLoaded', ()=>{ htmx.ajax('GET','/sueldos-basicos/list','#sueldos-basicos-list'); });</script>
  </section>
</html>
