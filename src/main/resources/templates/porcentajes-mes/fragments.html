<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <div th:fragment="lista">
    <div th:if="${#lists.isEmpty(items)}">No hay porcentajes.</div>
    <div th:each="p : ${items}" class="card mb-2 p-2">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <strong th:text="${p.id}">ID</strong>
          <div class="muted" th:text="${p.valor}">Valor</div>
        </div>
      </div>
    </div>
  </div>

  <div th:fragment="form">
    <form th:action="@{/porcentajes-mes/save}" th:object="${porcentaje}" hx-post="/porcentajes-mes/save" hx-target="#porcentajes-mes-list" hx-swap="innerHTML">
      <input type="hidden" th:field="*{id}" />
      <div class="mb-2">
        <label>Valor</label>
        <input class="form-control" th:field="*{valor}" />
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-primary" type="submit">Guardar</button>
        <button type="button" class="btn btn-secondary" onclick="htmx.ajax('GET','/porcentajes-mes/list','#porcentajes-mes-list')">Cancelar</button>
      </div>
    </form>
  </div>
</html>
