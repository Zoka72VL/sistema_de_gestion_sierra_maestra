<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(~{::content})">
  <section th:fragment="content">
    <div class="card p-3 mb-3">
      <div class="d-flex justify-content-between align-items-center">
        <h2 class="m-0">Cervezas</h2>
        <div>
          <button class="btn btn-outline-primary me-2" hx-get="/cervezas/list" hx-target="#cervezas-list" hx-swap="innerHTML">Cargar</button>
          <button class="btn btn-success" hx-get="/cervezas/form" hx-target="#cerveza-form" hx-swap="innerHTML">Nuevo</button>
        </div>
      </div>
      <!-- Buscadores agregados -->
       <!-- Buscar por ID -->
      <div class="row mt-3">
        <div class="col-md-4 d-flex">
          <input 
            type="text" 
            class="form-control" 
            placeholder="Buscar por ID..." 
            id="buscar-id"
            name="id"
            autocomplete="off"
          >
          <button 
            class="btn btn-primary ms-2"
            type="button"
            onclick="
              const id = document.getElementById('buscar-id').value;
              if(id){
                htmx.ajax('GET', '/cervezas/buscar-por-id/' + id, '#detalle-cerveza');
              } else {
                document.getElementById('detalle-cerveza').innerHTML = '<div class=\'alert alert-warning\'>Ingrese un ID</div>';
              }
            "
          >
            Buscar
          </button>

        <!-- Buscar por estado -->
        </div>
        <div class="col-md-4 d-flex">
          <select 
            class="form-select"
            id="buscar-estado"
            name="estado"
            autocomplete="off"
          >
            <option value="">Buscar por estado...</option>
            <option value="Disponible">Disponible</option>
            <option value="Agotado">Agotado</option>
            <option value="Producción">Producción</option>
            <option value="Mantenimiento">Mantenimiento</option>
          </select>
          <button 
            class="btn btn-primary ms-2"
            type="button"
            onclick="
              const estado = document.getElementById('buscar-estado').value;
              if(estado){
                htmx.ajax('GET', '/cervezas/buscar-por-estado/' + encodeURIComponent(estado), '#lista-cervezas-estado');
                document.getElementById('descargar-excel').style.display = 'inline-block';
                document.getElementById('descargar-pdf').style.display = 'inline-block';
                document.getElementById('descargar-excel').setAttribute('data-estado', estado);
                document.getElementById('descargar-pdf').setAttribute('data-estado', estado);
              } else {
                document.getElementById('lista-cervezas-estado').innerHTML = '<div class=\'alert alert-warning\'>Seleccione un estado</div>';
                document.getElementById('descargar-excel').style.display = 'none';
                document.getElementById('descargar-pdf').style.display = 'none';
              }
            "
          >
            Buscar
          </button>
          <button 
            id="descargar-excel"
            class="btn btn-outline-success ms-2"
            type="button"
            style="display:none"
            onclick="
              const estadoExcel = this.getAttribute('data-estado');
              if(estadoExcel){
                window.open('/cervezas/exportar-estado-excel/' + encodeURIComponent(estadoExcel), '_blank');
              }
            "
          >
            Descargar Excel
          </button>
          <button 
            id="descargar-pdf"
            class="btn btn-outline-danger ms-2"
            type="button"
            style="display:none"
            onclick="
              const estadoPdf = this.getAttribute('data-estado');
              if(estadoPdf){
                window.open('/cervezas/exportar-estado-pdf/' + encodeURIComponent(estadoPdf), '_blank');
              }
            "
          >
            Descargar PDF
          </button>
        </div>
      </div>

      <!-- Detalle de cerveza por ID -->
      <div id="detalle-cerveza" class="mt-3"></div>
      
      <!-- Lista de cervezas por estado -->
      <div id="lista-cervezas-estado" class="mt-3"></div>
    </div>

    <div id="cervezas-list"></div>
    <div id="cerveza-form" class="mt-3"></div>

    <script>
      document.addEventListener('DOMContentLoaded', ()=>{
        htmx.ajax('GET','/cervezas/list','#cervezas-list');
      });
    </script>
  </section>
</html>
