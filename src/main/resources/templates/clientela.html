<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout :: layout(~{::body})">

<body>

<div class="container mt-4">

  <!-- Bloque: Generación de Pedido -->
  <div class="card mb-4">
    <div class="card-header">
      <h4 class="mb-0">Generar Pedido</h4>
    </div>
    <div class="card-body">
      <form id="formPedido">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="cliente">Cliente</label>
            <input type="text" id="cliente" class="form-control" required>
          </div>
          <div class="col-md-6 mb-3">
            <label for="fechaEntrega">Fecha de Entrega</label>
            <input type="date" id="fechaEntrega" class="form-control" required>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="direccionEnvio">Dirección de Envío</label>
            <input type="text" id="direccionEnvio" class="form-control">
          </div>
          <div class="col-md-6 mb-3">
            <label for="estado">Estado</label>
            <select id="estado" class="form-control">
              <option value="Pendiente">Pendiente</option>
              <option value="Activo">Activo</option>
              <option value="Entregado">Entregado</option>
              <option value="Cancelado">Cancelado</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn btn-success">Guardar Pedido</button>
      </form>
    </div>
  </div>

  <!-- Bloque: Listado de Pedidos -->
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h4 class="mb-0">Listado de Pedidos</h4>
      <a href="/home.html" class="btn btn-primary">Inicio</a>
    </div>
    <div class="card-body">

      <!-- Buscador -->
      <div class="mb-3">
        <label for="campoBusqueda"><strong>Buscar pedido:</strong></label>
        <select id="campoBusqueda" class="form-select d-inline-block w-auto">
          <option value="">-- Seleccionar campo --</option>
          <option value="cliente">Cliente</option>
          <option value="usuario">Usuario</option>
          <option value="estado">Estado</option>
          <option value="direccionEnvio">Dirección de envío</option>
        </select>
        <input type="text" id="valorBusqueda" class="form-control d-inline-block w-auto" placeholder="Escriba búsqueda" />
        <button type="button" class="btn btn-secondary" onclick="buscarPedidos()">Buscar</button>
        <button type="button" class="btn btn-outline-secondary" onclick="loadAll()">Ver todos</button>
      </div>

      <!-- Tabla -->
      <div class="table-responsive">
        <table class="table table-striped table-bordered">
          <thead>
            <tr>
              <th>ID</th>
              <th>Fecha Pedido</th>
              <th>Fecha Entrega</th>
              <th>Cliente</th>
              <th>Usuario</th>
              <th>Estado</th>
              <th>Dirección de envío</th>
              <th>Total</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaPedidos">
            <!-- Se carga dinámicamente con JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<!-- Script -->
<script src="/js/pedidos.js">
    
</script>

</body>
</html>
