<!-- ============================= -->
<!-- Fragmento: Formulario Cerveza -->
<!-- ============================= -->
<div th:fragment="form-cerveza">
    <form id="formCerveza">
        <div class="form-group">
            <label for="nombreCerveza">Nombre</label>
            <input type="text" class="form-control" id="nombreCerveza" name="nombreCerveza" required />
        </div>

        <div class="form-group">
            <label for="tipoCerveza">Tipo</label>
            <input type="text" class="form-control" id="tipoCerveza" name="tipoCerveza" required />
        </div>

        <div class="form-group">
            <label for="gradoAlcoholico">Grado Alcohólico (%)</label>
            <input type="number" step="0.1" class="form-control" id="gradoAlcoholico" name="gradoAlcoholico" required />
        </div>

        <div class="form-group">
            <label for="amargorIbu">Amargor (IBU)</label>
            <input type="number" min="1" class="form-control" id="amargorIbu" name="amargorIbu" required />
        </div>

        <div class="form-group">
            <label for="descripcion">Descripción</label>
            <textarea class="form-control" id="descripcion" name="descripcion"></textarea>
        </div>

        <div class="form-group">
            <label for="precioPorLitro">Precio por Litro</label>
            <input type="number" step="0.01" class="form-control" id="precioPorLitro" name="precioPorLitro" required />
        </div>

        <div class="form-group">
            <label for="estado">Estado</label>
            <select class="form-control" id="estado" name="estado" required>
                <option value="">Seleccione...</option>
                <option value="Disponible">Disponible</option>
                <option value="Agotada">Agotada</option>
                <option value="Produccion">Producción</option>
                <option value="Mantenimiento">Mantenimiento</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary mt-3">Guardar</button>
    </form>
</div>
