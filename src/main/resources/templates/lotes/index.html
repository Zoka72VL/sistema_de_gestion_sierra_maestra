<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(~{::content})">
  <section th:fragment="content">
    <div class="card p-3 mb-3">
      <div class="d-flex justify-content-between align-items-center">
        <h2 class="m-0">Lotes</h2>
        <div>
          <button class="btn btn-outline-primary me-2" hx-get="/lotes/list" hx-target="#lotes-list" hx-swap="innerHTML"><i class="bi bi-arrow-repeat me-1"></i>Actualizar</button>
          <button class="btn btn-success" hx-get="/lotes/form" hx-target="#lote-form" hx-swap="innerHTML"><i class="bi bi-plus-lg me-1"></i>Nuevo</button>
        </div>
      </div>

      <!-- 🔹 Buscador por ID -->
      <div class="mt-3 d-flex gap-2">
        <input type="number" id="buscarId" class="form-control" placeholder="Ingrese ID del lote" />
        <button class="btn btn-primary"
                onclick="buscarLotePorId()">
          Buscar
        </button>
      </div>

      <!-- 🔹 Buscador por ESTADO -->
      <div class="mt-3 d-flex gap-2">
        <select id="buscarEstado" class="form-select">
            <option value="">Seleccione estado</option>
            <option value="Produccion">Producción</option>
            <option value="Madurando">Madurando</option>
            <option value="Terminado">Terminado</option>
            <option value="Mantenimiento">Mantenimiento</option>
        </select>
        <button class="btn btn-primary" onclick="buscarLotesPorEstado()">
            Buscar
        </button>
    </div>


    <!-- Aquí se mostrará el lote buscado -->
    <div id="resultado-busqueda" class="mt-3"></div>
    <!-- Aquí se mostrarán los lotes filtrados por estado -->
    <div id="resultado-busqueda-estado" class="mt-3"></div>
    </div>

    <div id="lotes-list"></div>
    <div id="lote-form" class="mt-3"></div>

    <script>

    function buscarLotePorId() {
    const id = document.getElementById('buscarId').value;
    if(!id) return alert('Ingrese un ID');

    fetch(`/getByIdLote/${id}`)
        .then(response => response.json())
        .then(data => {
            const lote = data.data;
            let html = '';
            if(lote) {
                html = `
                <div class="card p-3 mb-2">
                    <h6>Detalle Lote</h6>
                    <div><strong>Id:</strong> ${lote.id}</div>
                    <div><strong>Cerveza:</strong> ${lote.cerveza ? lote.cerveza.nombreCerveza : '-'}</div>
                    <div><strong>Cantidad (L):</strong> ${lote.cantidadLitros}</div>
                    <div><strong>Estado:</strong> ${lote.estado}</div>
                    <div><strong>Notas:</strong> ${lote.notas || '-'}</div>
                    <div><strong>Fecha Carga:</strong> ${lote.fechaCarga || '-'}</div>
                    <div><strong>Fecha Carga Madurador:</strong> ${lote.fechaCargaMadurador || '-'}</div>
                    <div><strong>Fecha Vencimiento:</strong> ${lote.fechaVencimiento || '-'}</div>
                </div>`;
            } else {
                html = '<div>No se encontró el lote.</div>';
            }
            document.getElementById('resultado-busqueda').innerHTML = html;
        })
        .catch(err => {
            console.error(err);
            document.getElementById('resultado-busqueda').innerHTML = '<div>Error al buscar lote</div>';
        });
}

      function buscarLotesPorEstado() {
    const estado = document.getElementById('buscarEstado').value;
    if(!estado) return alert('Seleccione un estado');

    fetch(`/findLotesPorEstado/${estado}`)
        .then(response => response.json())
        .then(data => {
            const lotes = data.data;
            let html = '';

            if(lotes && lotes.length > 0) {
                html = lotes.map(lote => `
                    <div class="card p-3 mb-2">
                        <h6>Lote ID: ${lote.id}</h6>
                        <div><strong>Cerveza:</strong> ${lote.cerveza ? lote.cerveza.nombreCerveza : '-'}</div>
                        <div><strong>Cantidad (L):</strong> ${lote.cantidadLitros}</div>
                        <div><strong>Estado:</strong> ${lote.estado}</div>
                        <div><strong>Notas:</strong> ${lote.notas || '-'}</div>
                        <div><strong>Fecha Carga:</strong> ${lote.fechaCarga || '-'}</div>
                        <div><strong>Fecha Carga Madurador:</strong> ${lote.fechaCargaMadurador || '-'}</div>
                        <div><strong>Fecha Vencimiento:</strong> ${lote.fechaVencimiento || '-'}</div>
                    </div>
                `).join('');
            } else {
                html = '<div>No se encontraron lotes con ese estado.</div>';
            }

            document.getElementById('resultado-busqueda-estado').innerHTML = html;
        })
        .catch(err => {
            console.error(err);
            document.getElementById('resultado-busqueda-estado').innerHTML = '<div>Error al buscar lotes</div>';
        });
}

      document.addEventListener('DOMContentLoaded', ()=>{ htmx.ajax('GET','/lotes/list','#lotes-list'); });
    </script>
  </section>
</html>
