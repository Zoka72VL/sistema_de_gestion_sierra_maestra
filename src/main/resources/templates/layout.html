<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="layout (content)">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title th:text="${title}">Sierra Maestra</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
  <script src="https://unpkg.com/htmx.org@1.9.2"></script>
  <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body class="p-3">
  <div class="container">
      <header class="d-flex justify-content-between align-items-center mb-3">
        <div class="d-flex align-items-center">
          <a class="navbar-brand me-3 fw-bold text-decoration-none" th:href="@{/}">Sierra Maestra</a>
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item"><a th:href="@{/}">Inicio</a></li>
              <li class="breadcrumb-item active" th:text="${title}" aria-current="page">Sección</li>
            </ol>
          </nav>
        </div>
      </header>

      <!-- Insert the fragment passed by child templates (only if provided) -->
      <div th:if="${content != null}" th:insert="${content}"></div>
      <div th:unless="${content != null}">
        <div class="card p-4">
          <h2>Bienvenido al sistema de gestión de Sierra Maestra</h2>
          <p class="muted">Use la navegación para abrir Pedidos o Lotes.</p>
    </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
