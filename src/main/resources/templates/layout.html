<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="layout (content)">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title th:text="${title}">Sierra Maestra</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
  <script src="https://unpkg.com/htmx.org@1.9.2" onerror="this.onerror=null;var s=document.createElement('script');s.src='/js/htmx.local.js';document.head.appendChild(s);"></script>
  <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body class="p-3">
  <div class="container">
      <header class="d-flex justify-content-between align-items-center mb-3">
        <div class="d-flex align-items-center">
          <a class="navbar-brand me-3 fw-bold text-decoration-none" th:href="@{/}">Sierra Maestra</a>
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item"><a th:href="@{/}">Inicio</a></li>
              <li class="breadcrumb-item active" th:text="${title}" aria-current="page">Sección</li>
            </ol>
          </nav>
        </div>
      </header>

      <!-- Insert the fragment passed by child templates (only if provided) -->
      <div th:if="${content != null}" th:insert="${content}"></div>
      <div th:unless="${content != null}">
        <div class="card p-4">
          <h2>Bienvenido al sistema de gestión de Sierra Maestra</h2>
          <p class="muted">Use la navegación para abrir Pedidos o Lotes.</p>
    </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Fallback: if HTMX failed to load in the client, provide a minimal handler
    // so buttons with hx-get and forms with hx-post still work.
    (function(){
      if (window.htmx) return; // nothing to do when htmx exists

      // handle hx-get buttons/links
      document.addEventListener('click', function(ev){
        var btn = ev.target.closest && ev.target.closest('[hx-get]');
        if (!btn) return;
        try { ev.preventDefault(); } catch(e){}
        var url = btn.getAttribute('hx-get');
        var targetSelector = btn.getAttribute('hx-target');
        var swap = btn.getAttribute('hx-swap') || 'innerHTML';
        var target = targetSelector ? document.querySelector(targetSelector) : null;
        if (!url || !target) return;
        fetch(url, { credentials: 'same-origin' })
          .then(function(r){ return r.text(); })
          .then(function(html){ target.innerHTML = html; })
          .catch(function(){ /* swallow errors in fallback */ });
      }, true);

      // handle forms with hx-post
      document.addEventListener('submit', function(ev){
        var form = ev.target;
        if (!form || !form.hasAttribute('hx-post')) return;
        try { ev.preventDefault(); } catch(e){}
        var url = form.getAttribute('hx-post') || form.getAttribute('action');
        var targetSelector = form.getAttribute('hx-target');
        var target = targetSelector ? document.querySelector(targetSelector) : null;
        var formData = new FormData(form);
        if (!url) return;
        fetch(url, { method: 'POST', body: formData, credentials: 'same-origin' })
          .then(function(r){ return r.text(); })
          .then(function(html){ if (target) target.innerHTML = html; })
          .catch(function(){ /* ignore fallback errors */ });
      }, true);
    })();
  </script>
  <script>
    // Debug helpers: only active for local dev (localhost / 127.0.0.1)
    try {
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
        if (window.htmx && typeof htmx.logAll === 'function') {
          console.info('HTMX present — enabling detailed logs');
          htmx.logAll();
        } else {
          console.info('HTMX not present in page');
        }

        document.addEventListener('click', function(e){
          var btn = e.target.closest && e.target.closest('[hx-get],[hx-post]');
          if (btn) {
            console.debug('DEBUG: click on element with HTMX attr', btn.getAttribute('hx-get') || btn.getAttribute('hx-post'), btn);
          }
        }, true);

        document.addEventListener('submit', function(e){
          var form = e.target;
          if (form && form.hasAttribute('hx-post')) {
            console.debug('DEBUG: form submit (hx-post)', form.getAttribute('hx-post'), form);
          }
        }, true);
      }
    } catch (err) {
      console.error('Debug helper error', err);
    }
  </script>
  <script>
    // HTMX event tracing to help debug swap/requests in the browser
    try {
      if (window.htmx) {
        ['htmx:beforeRequest','htmx:afterSwap','htmx:afterRequest','htmx:responseError'].forEach(function(ev){
          document.addEventListener(ev, function(e){
            try {
              var d = e && e.detail ? e.detail : {};
              if (ev === 'htmx:afterSwap' && d.target) {
                try {
                  var content = (d.target && d.target.innerHTML) || '';
                  console.info('[htmx] afterSwap target=', d.target.id || d.target, 'status=', d.xhr && d.xhr.status, 'len=', content.length, 'preview=', content.substr(0,200));
                  try {
                    var el = d.target;
                    if (el && el.style) {
                      var prevBg = el.style.backgroundColor;
                      el.style.transition = 'background-color 180ms ease-in-out';
                      el.style.backgroundColor = '#e6ffe6';
                      setTimeout(function(){ el.style.backgroundColor = prevBg || ''; }, 400);
                    }
                  } catch(err){ /* ignore visual flash errors */ }
                } catch(e){ console.info('[htmx] afterSwap target=', d.target.id || d.target, 'status=', d.xhr && d.xhr.status); }
              } else if (ev === 'htmx:beforeRequest') {
                console.info('[htmx] beforeRequest ->', d.path || d.verb || d.target || (d.xhr && d.xhr.responseURL) || d);
              } else if (ev === 'htmx:afterRequest') {
                console.info('[htmx] afterRequest', d.xhr && d.xhr.status, d.xhr && d.xhr.responseURL);
              } else if (ev === 'htmx:responseError') {
                console.error('[htmx] responseError', d.xhr && d.xhr.status, d.xhr && d.xhr.responseText);
              }
            } catch (err) { console.error('htmx debug listener error', err); }
          }, false);
        });
      }
    } catch(e) { console.error('htmx debug install failed', e); }
  </script>
  <script>
    // When the cervezas list region changes, clear the cerveza form area.
    // This works both with real htmx and the local fallback that directly
    // swaps innerHTML, so Cancel and successful saves will remove the form.
    (function(){
      try {
        var listEl = document.querySelector('#cervezas-list');
        var formEl = document.querySelector('#cerveza-form');
        if (!listEl) return; // nothing to observe on pages without the list

        var observer = new MutationObserver(function(mutations){
          // any change in the list -> clear the form area if present
          try {
            if (!formEl) formEl = document.querySelector('#cerveza-form');
            if (formEl) formEl.innerHTML = '';
          } catch (err) { /* ignore */ }
        });

        observer.observe(listEl, { childList: true, subtree: false });
      } catch (err) { console.error('cervezas list observer failed', err); }
    })();
  </script>
</body>
</html>
