  <div th:fragment="lista" xmlns:th="http://www.thymeleaf.org">
  <div th:fragment="lista">
    <div th:if="${#lists.isEmpty(items)}">No hay accesorios.</div>
    <div th:each="a : ${items}" class="card mb-2 p-2">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <strong th:text="${a.id}">ID</strong>
          <div class="muted" th:text="${a.nombre}">Nombre</div>
        </div>

        <div th:fragment="form">
          <form th:action="@{/accesorios/save}" th:object="${accesorio}" hx-post="/accesorios/save" hx-target="#accesorios-list" hx-swap="innerHTML">
            <input type="hidden" th:field="*{id}" />
            <div class="mb-2">
              <label>Nombre</label>
              <input class="form-control" th:field="*{nombre}" required />
            </div>
            <div class="mb-2">
              <label>Estado</label>
              <input class="form-control" th:field="*{estado}" />
            </div>
            <div class="mb-2">
              <label>Notas</label>
              <input class="form-control" th:field="*{notas}" />
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-primary" type="submit">Guardar</button>
              <button type="button" class="btn btn-secondary" hx-get="/accesorios/list" hx-target="#accesorios-list" hx-swap="innerHTML">Cancelar</button>
            </div>
          </form>
        </div>
  <button class="btn btn-primary" type="submit">Guardar</button>
  <button type="button" class="btn btn-secondary" hx-get="/accesorios/list" hx-target="#accesorios-list" hx-swap="innerHTML">Cancelar</button>
      </div>
    </form>
  </div>
</html>
