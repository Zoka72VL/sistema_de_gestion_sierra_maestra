<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(~{::content})">
  <section th:fragment="content">
    <div class="card p-3 mb-3">
      <div class="d-flex justify-content-between align-items-center">
        <h2 class="m-0">Accesorios</h2>
        <div>
          <button class="btn btn-outline-primary me-2" hx-get="/accesorios/list" hx-target="#accesorios-list" hx-swap="innerHTML">Cargar</button>
          <button class="btn btn-success" hx-get="/accesorios/form" hx-target="#accesorio-form" hx-swap="innerHTML">Nuevo</button>
        </div>
      </div>
    </div>

    <div id="accesorios-list"></div>
    <div id="accesorio-form" class="mt-3"></div>
    <script>document.addEventListener('DOMContentLoaded', ()=>{ htmx.ajax('GET','/accesorios/list','#accesorios-list'); });</script>
  </section>
</html>
