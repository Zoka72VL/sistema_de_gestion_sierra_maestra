<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(~{::content})">
  <section th:fragment="content">
    <div class="card p-3 mb-3">
      <div class="d-flex justify-content-between align-items-center">
        <h2 class="m-0">Accesorios</h2>
        <div>
          <button class="btn btn-outline-primary me-2" hx-get="/accesorios/list" hx-target="#accesorios-list" hx-swap="innerHTML">Cargar</button>
          <button class="btn btn-success" hx-get="/accesorios/form" hx-target="#accesorio-form" hx-swap="innerHTML">Nuevo</button>
        </div>
      </div>

      <!-- Buscar por ID -->
      <div class="row mt-3">
  <div class="col-md-4 d-flex">
    <input 
      type="text" 
      class="form-control" 
      placeholder="Buscar por ID..." 
      id="buscar-id"
      name="id"
      autocomplete="off"
    >
    <button 
      class="btn btn-primary ms-2"
      type="button"
      onclick="
        const id = document.getElementById('buscar-id').value;
        if(id){
          htmx.ajax('GET', '/getByIdAccesorio/' + id, '#accesorio-form');
        } else {
          document.getElementById('accesorio-form').innerHTML = '<div class=\'alert alert-warning\'>Ingrese un ID</div>';}"
          >
      Buscar
    </button>
  </div>

  <!-- Buscar por Estado -->
  <div class="col-md-4 d-flex">
    <select 
      class="form-select"
      id="buscar-estado"
      name="estado"
      autocomplete="off"
    >
      <option value="">Buscar por estado...</option>
      <option value="Disponible">Disponible</option>
      <option value="Alquilado">Alquilado</option>
      <option value="Devuelto">Devuelto</option>
      <option value="Mantenimiento">Mantenimiento</option>
      <option value="Inactivo">Inactivo</option>
      <option value="Sucio">Sucio</option>
    </select>
    <button 
      class="btn btn-primary ms-2"
      type="button"
      onclick="
        const estado = document.getElementById('buscar-estado').value;
        if(estado){
          htmx.ajax('GET', '/findAccesoriosPorEstado/' + encodeURIComponent(estado), '#accesorios-list');
        } else {
          document.getElementById('accesorios-list').innerHTML = '<div class=\'alert alert-warning\'>Seleccione un estado</div>';
        }
      "
    >
      Buscar
    </button>
  </div>
</div>


    </div>

    <div id="accesorios-list"></div>
    <div id="accesorio-form" class="mt-3"></div>
    
    <script>
    
    function mostrarListaAccesorios(accesorios){
    let html = '';
    if(accesorios && accesorios.length > 0){
        accesorios.forEach(a => {
            html += `<div class="card mb-2 p-2">
                        <strong>${a.id}</strong> - ${a.nombre} - ${a.estado}
                        <p>${a.notas || ''}</p>
                    </div>`;
        });
    } else {
        html = '<div class="text-muted">No se encontraron accesorios</div>';
    }
    document.getElementById('accesorios-list').innerHTML = html;
}

    
    document.addEventListener('DOMContentLoaded', ()=>{ htmx.ajax('GET','/accesorios/list','#accesorios-list'); });
    </script>
  </section>
</html>
