<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(~{::content})">
  <section th:fragment="content">
    <div class="card p-3 mb-3">
      <div class="d-flex justify-content-between align-items-center">
        <h2 class="m-0">Accesorios</h2>
        <div>
          <button class="btn btn-outline-primary me-2" hx-get="/accesorios/list" hx-target="#accesorios-list" hx-swap="innerHTML">Cargar</button>
          <button class="btn btn-success" hx-get="/accesorios/form" hx-target="#accesorio-form" hx-swap="innerHTML">Nuevo</button>
        </div>
      </div>

    <!-- Buscar por ID -->
  <div>
    <input type="number" id="idAccesorioInput" placeholder="Ingrese ID del accesorio">
    <button type="button" onclick="buscarAccesorioPorId()">Buscar</button>
  </div>

  <!-- Buscar por Estado -->
  <div class="col-md-4 d-flex">
    <select id="buscarEstadoAccesorio" class="form-select"
    >
      <option value="">Buscar por estado...</option>
      <option value="Disponible">Disponible</option>
      <option value="Alquilado">Alquilado</option>
      <option value="Devuelto">Devuelto</option>
      <option value="Mantenimiento">Mantenimiento</option>
      <option value="Inactivo">Inactivo</option>
      <option value="Sucio">Sucio</option>
    </select>
    <button
      class="btn btn-primary" onclick="buscarAccesorioPorEstado()"
    >
      Buscar
    </button>
  </div>
</div>

    <div id="resultadoAccesorio" class="mt-3"></div>
    <!-- 🔹 Aquí se mostrarán los resultados -->
    <div id="resultado-busqueda-estado-accesorio" class="mt-3"></div>
</div>

    <div id="accesorios-list"></div>
    <div id="accesorio-form" class="mt-3"></div>
    
    <script>

    async function buscarAccesorioPorId() {
  const id = document.getElementById("idAccesorioInput").value;
  const resultadoDiv = document.getElementById("resultadoAccesorio");

  if (!id) {
    alert("Por favor ingrese un ID");
    return;
  }

  try {
    const response = await fetch(`/getByIdAccesorio/${id}`);
    if (!response.ok) throw new Error("Error al obtener el accesorio");

    const data = await response.json();

    if (data.codigo === "200" && data.data) {
      const accesorio = data.data;
      resultadoDiv.innerHTML = `
        <h5>Accesorio encontrado:</h5>
        <ul>
          <li><b>ID:</b> ${accesorio.id}</li>
          <li><b>Nombre:</b> ${accesorio.nombre || '—'}</li>
          <li><b>Tipo:</b> ${accesorio.tipo || '—'}</li>
          <li><b>Estado:</b> ${accesorio.estado || '—'}</li>
          <li><b>Descripción:</b> ${accesorio.descripcion || '—'}</li>
        </ul>
      `;
    } else {
      resultadoDiv.innerHTML = `<p>No se encontró ningún accesorio con ese ID.</p>`;
    }
  } catch (error) {
    console.error("Error:", error);
    resultadoDiv.innerHTML = `<p>Error al buscar el accesorio.</p>`;
  }
}
    

    //Buscar por estado
    function buscarAccesorioPorEstado() {
        const estado = document.getElementById('buscarEstadoAccesorio').value;
        if (!estado) return alert('Seleccione un estado');

        fetch(`/accesorios/findAccesorioPorEstado/${estado}`)
            .then(response => response.json())
            .then(data => {
                console.log ("Respuesta completa:", data)
                const accesorios = data.data;
                let html = '';

                if (accesorios && accesorios.length > 0) {
                    html = accesorios.map(acc => `
                        <div class="card p-3 mb-2">
                            <h6>Accesorio ID: ${acc.id}</h6>
                            <div><strong>Nombre:</strong> ${acc.nombre || '-'}</div>
                            <div><strong>Tipo:</strong> ${acc.tipo || '-'}</div>
                            <div><strong>Estado:</strong> ${acc.estado || '-'}</div>
                            <div><strong>Descripción:</strong> ${acc.descripcion || '-'}</div>
                        </div>
                    `).join('');
                } else {
                    html = '<div>No se encontraron accesorios con ese estado.</div>';
                }

                document.getElementById('resultado-busqueda-estado-accesorio').innerHTML = html;
            })
            .catch(err => {
                console.error(err);
                document.getElementById('resultado-busqueda-estado-accesorio').innerHTML = '<div>Error al buscar accesorios</div>';
            });
    }

    
    document.addEventListener('DOMContentLoaded', ()=>{ htmx.ajax('GET','/accesorios/list','#accesorios-list'); });
    </script>
  </section>
</html>
