<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(~{::content})">
  <section th:fragment="content">
    <div class="card p-3 mb-3">
      <div class="d-flex justify-content-between align-items-center">
        <h2 class="m-0">Clientes</h2>
        <div>
          <button class="btn btn-outline-primary me-2" hx-get="/clientes/list" hx-target="#clientes-list" hx-swap="innerHTML">Cargar</button>
          <button class="btn btn-success" hx-get="/clientes/form" hx-target="#cliente-form" hx-swap="innerHTML">Nuevo</button>
        </div>
      </div>
    </div>

    <div id="clientes-list"></div>
    <div id="cliente-form" class="mt-3"></div>

    <script>document.addEventListener('DOMContentLoaded', ()=>{ htmx.ajax('GET','/clientes/list','#clientes-list'); });</script>
  </section>
</html>
