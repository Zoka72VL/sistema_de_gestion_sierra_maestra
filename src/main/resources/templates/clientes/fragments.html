<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <div th:fragment="lista">
    <div th:if="${#lists.isEmpty(items)}">No hay clientes.</div>
    <div th:each="c : ${items}" class="card mb-2 p-2">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <strong th:text="${c.id}">ID</strong>
          <div class="muted" th:text="${c.nombre}">Nombre</div>
        </div>
        <div>
          <button class="btn btn-sm btn-outline-secondary me-1" hx-get="/clientes/${c.id}" hx-target="#cliente-form" hx-swap="innerHTML"><i class="bi bi-pencil-fill"></i></button>
          <button class="btn btn-sm btn-outline-danger" hx-delete="/deleteCliente/${c.id}" hx-confirm="Eliminar?" hx-on:afterRequest="htmx.ajax('GET','/clientes/list','#clientes-list')"><i class="bi bi-trash-fill"></i></button>
        </div>
      </div>
    </div>
  </div>

  <div th:fragment="form">
    <form th:action="@{/clientes/save}" th:object="${cliente}" hx-post="/clientes/save" hx-target="#clientes-list" hx-swap="innerHTML">
      <input type="hidden" th:field="*{id}" />
      <div class="mb-2">
        <label>Nombre</label>
        <input class="form-control" th:field="*{nombre}" required />
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-primary" type="submit">Guardar</button>
        <button type="button" class="btn btn-secondary" onclick="htmx.ajax('GET','/clientes/list','#clientes-list')">Cancelar</button>
      </div>
    </form>
  </div>
</html>
