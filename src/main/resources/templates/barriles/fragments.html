  <div th:fragment="lista" xmlns:th="http://www.thymeleaf.org">
    <div th:if="${#lists.isEmpty(items)}">No hay barriles.</div>
    <div th:each="b : ${items}" class="card mb-2 p-2">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <strong th:text="${b.id}">ID</strong>
          <div class="muted" th:text="${b.descripcion}">Descripcion</div>
        </div>
        <div>
          <button class="btn btn-sm btn-outline-secondary me-1" th:attr="hx-get=@{/barriles/{id}(id=${b.id})}" hx-target="#barril-form" hx-swap="innerHTML"><i class="bi bi-pencil-fill"></i></button>
          <button class="btn btn-sm btn-outline-danger" th:attr="hx-delete=@{/deleteBarril/{id}(id=${b.id})}" hx-confirm="Eliminar?"><i class="bi bi-trash-fill"></i></button>
        </div>
      </div>
    </div>
  </div>

  <div th:fragment="form">
    <form th:action="@{/barriles/save}" th:object="${barril}" hx-post="/barriles/save" hx-target="#barriles-list" hx-swap="innerHTML">
      <input type="hidden" th:field="*{id}" />
      <div class="mb-2">
        <label>Descripción</label>
        <input class="form-control" th:field="*{descripcion}" required />
      </div>
      <div class="mb-2">
        <label>Lote</label>
        <select class="form-select" th:field="*{lote.id}">
          <option th:each="l : ${lotes}" th:value="${l.id}" th:text="${l.cerveza != null ? l.cerveza.nombreCerveza : 'Lote ' + l.id}">Lote</option>
        </select>
      </div>
      <div class="d-flex gap-2">
  <button class="btn btn-primary" type="submit">Guardar</button>
  <button type="button" class="btn btn-secondary" hx-get="/barriles/list" hx-target="#barriles-list" hx-swap="innerHTML">Cancelar</button>
      </div>
    </form>
  </div>
