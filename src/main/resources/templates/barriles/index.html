<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(~{::content})">
  <section th:fragment="content">
    <div class="card p-3 mb-3">
      <div class="d-flex justify-content-between align-items-center">
        <h2 class="m-0">Barriles</h2>
        <div>
          <button class="btn btn-outline-primary me-2" hx-get="/barriles/list" hx-target="#barriles-list" hx-swap="innerHTML">Actualizar</button>
          <button class="btn btn-success" hx-get="/barriles/form" hx-target="#barril-form" hx-swap="innerHTML">Nuevo</button>
        </div>
      </div>
      
      <!-- Buscador por ID -->
      <div class="mt-3 d-flex gap-2">
        <input type="number" id="buscarIdBarril" class="form-control" placeholder="Ingrese ID del barril" />
        <button class="btn btn-primary" onclick="buscarBarrilPorId()">Buscar</button>
      </div>

      <!-- 🔍 Buscador por Estado -->
      <div class="card p-3 mb-3">
        <h5>Buscar barril por estado</h5>
        <div class="input-group">
          <select id="estadoBarril" class="form-select">
            <option value="">-- Selecciona un estado --</option>
            <option value="Disponible">Disponible</option>
            <option value="Cargado">Cargado</option>
            <option value="Alquilado">Alquilado</option>
            <option value="Despacho">Despacho</option>
            <option value="Devuelto">Devuelto</option>
            <option value="Sucio">Sucio</option>
          </select>
          <button class="btn btn-primary" onclick="buscarBarrilPorEstado()">Buscar</button>
        </div>
      </div>

    </div>

    <!-- Aquí se mostrará el resultado sin tocar #barriles-list -->
    <div id="resultado-busqueda-barril" class="mt-3"></div>
    <!-- 📋 Resultado de la búsqueda -->
    <div id="resultado-estado" class="mt-3"></div>

    <div id="barriles-list"></div>
    <div id="barril-form" class="mt-3"></div>
  <script>
  
    function buscarBarrilPorId() {
  const id = String(document.getElementById('buscarIdBarril').value).trim();
  if (!id) {
    alert('Ingrese un ID');
    return;
  }

  fetch(`/getByIdBarril/${encodeURIComponent(id)}`)
    .then(response => {
      if (!response.ok) throw new Error('Error HTTP ' + response.status);
      return response.json();
    })
    .then(res => {
      const b = res && res.data ? res.data : null;
      if (!b) {
        document.getElementById('resultado-busqueda-barril').innerHTML =
          '<div class="alert alert-warning">No se encontró el barril con ese ID.</div>';
        return;
      }

      const html = `
        <div class="card p-3 mb-2">
          <h6>Detalle Barril</h6>
          <div><strong>Id:</strong> ${b.id ?? '-'}</div>
          <div><strong>Litros:</strong> ${b.litros ?? '-'}</div>
          <div><strong>Estado:</strong> ${b.estado ?? '-'}</div>
          <div><strong>Notas:</strong> ${b.notas ?? '-'}</div>
          <div><strong>Lote ID:</strong> ${b.lote ? b.lote.id : '-'}</div>
        </div>
      `;
      document.getElementById('resultado-busqueda-barril').innerHTML = html;
    })
    .catch(err => {
      console.error('buscarBarrilPorId error', err);
      document.getElementById('resultado-busqueda-barril').innerHTML =
        `<div class="alert alert-danger">Error al buscar barril: ${err.message}</div>`;
    });
}

//Busqueda por estado
function buscarBarrilPorEstado() {
  const estado = document.getElementById("estadoBarril").value.trim();
  const contenedor = document.getElementById("resultado-estado");

  if (!estado) {
    contenedor.innerHTML = `<div class='alert alert-warning mt-2'>Por favor ingrese un estado.</div>`;
    return;
  }

  fetch(`/barril/findByEstado/${encodeURIComponent(estado)}`)
    .then(resp => resp.json())
    .then(data => {
      const lista = data.data || [];

      if (!lista || lista.length === 0) {
        contenedor.innerHTML = `<div class='alert alert-warning mt-2'>No se encontraron barriles con el estado "${estado}".</div>`;
        return;
      }

      // 🧱 Construimos tabla de resultados
      let html = `
        <table class="table table-bordered mt-3">
          <thead>
            <tr>
              <th>ID</th>
              <th>Litros</th>
              <th>Estado</th>
              <th>Notas</th>
            </tr>
          </thead>
          <tbody>`;

      lista.forEach(b => {
        html += `
          <tr>
            <td>${b.id}</td>
            <td>${b.litros ?? '-'}</td>
            <td>${b.estado ?? '-'}</td>
            <td>${b.notas ?? '-'}</td>
          </tr>`;
      });

      html += `</tbody></table>`;
      contenedor.innerHTML = html;
    })
    .catch(err => {
      console.error("Error al buscar:", err);
      contenedor.innerHTML = `<div class='alert alert-danger mt-2'>Error al buscar barriles: ${err.message}</div>`;
    });
}

  document.addEventListener('DOMContentLoaded', ()=>{ htmx.ajax('GET','/barriles/list','#barriles-list'); });</script>
  </section>
</html>
