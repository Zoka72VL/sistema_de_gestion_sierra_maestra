<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>Menu principal</title>
    <link rel="stylesheet" href="/css/menu-principal.css">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.2/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="/css/menu-styles.css">

    <style>
        body {
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>

<body class="bg-gray-100 bg-opacity-75">

    <!-- Header importado de menu-principal.html -->
    <header>
        <div class="logo">
            <a href="/menu-principal">
                <img src="img/logo-sierra-maestra.jpg" alt="Logo Sierra Maestra">
            </a>
        </div>
        <h2></h2>
        <nav>
            <ul class="menu">
                <li><a href="/cervezas">Cerveza</a></li>
                <li><a href="/clientes">Cliente</a></li>
                <!-- Dropdown Equipamiento -->
                <li class="relative group"><a href="#" class="items-center">Equipamiento</a>
                    <!-- Submenú desplegable -->
                    <ul class="absolute hidden group-hover:block bg-black shadow-lg rounded-md mt-1 w-32 py-2">
                        <li><a href="/barril" class="block px-4 py-2 hover:bg-gray-200">Barril</a></li>
                        <li><a href="/madurador" class="block px-4 py-2 hover:bg-gray-200">Madurador</a></li>
                        <li><a href="/accesorio" class="block px-4 py-2 hover:bg-gray-200">Accesorios</a></li>
                    </ul>
                </li>
                <li><a href="/lote">Lote</a></li>
                <li><a href="#">Pedidos</a></li>

                <!-- Dropdown Stock -->
                <li class="relative group"><a href="#" class="items-center">Stock</a>
                    <!-- Submenú desplegable -->
                    <ul class="absolute hidden group-hover:block bg-black shadow-lg rounded-md mt-1 w-32 py-2">
                        <li><a href="/barril" class="block px-4 py-2 hover:bg-gray-200">Stock por cerveza</a></li>
                    </ul>
                </li>

                <li><a href="/usuarios">Usuarios</a></li>
                <li><a href="/login">Cerrar Sesión</a></li>
            </ul>
        </nav>
        <!--  <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>-->
    </header>
    <br>

    <!-- Contenido principal de la página -->
    <div class="container mx-auto p-6 max-w-full mt-12">
        <div class="bg-white p-6 rounded-lg shadow-md max-w-full overflow-x-auto">
            <h1 class="text-2xl font-bold mb-4">Entrada rápida: Ingrese un número de lote</h1>
            <div class="flex flex-col sm:flex-row justify-between mb-4">
                <!--
                <a th:href="@{/lote/nuevo}">
                    <button class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 mb-2 sm:mb-0">Añadir Lote</button>
                </a>
                -->
            </div>
            <div class="flex justify-between mb-4">
                <!-- Formulario de filtro por ID -->
                <form th:action="@{/lote/buscar}" method="get" class="flex items-center space-x-2">
                    <input type="number" name="id" placeholder="Buscar por ID" class="px-2 py-1 border rounded-lg" required>
                    <button type="submit" class="bg-green-500 text-white px-4 py-1 rounded-lg hover:bg-green-600">Buscar</button>
                </form>
            </div>
        </div>
    </div>

    <div class="container mx-auto p-6 max-w-full mt-12">
        <div class="bg-white p-6 rounded-lg shadow-md max-w-full overflow-x-auto">
            <h1 class="text-2xl font-bold mb-4">Entrada rápida: Ingrese un número de barril</h1>
            <div class="flex flex-col sm:flex-row justify-between mb-4">
                <!--
                <a th:href="@{/barril/nuevo}">
                    <button class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 mb-2 sm:mb-0">Añadir Barril</button>
                </a>
                -->
            </div>
            <div class="flex justify-between mb-4">
                <!-- Formulario de filtro por ID -->
                <form th:action="@{/barril/buscar}" method="get" class="flex items-center space-x-2">
                    <input type="number" name="id" placeholder="Buscar por ID" class="px-2 py-1 border rounded-lg" required>
                    <button type="submit" class="bg-green-500 text-white px-4 py-1 rounded-lg hover:bg-green-600">Buscar</button>
                </form>
            </div>
        </div>
    </div>

    <script src="/js/menu-principal.js"></script>
</body>

</html>
